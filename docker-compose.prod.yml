services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: remote_screen_prod_backend
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI:-mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongo:27017/remote_screen_prod?authSource=admin}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379}
    volumes:
      - uploads_data:/app/backend/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4100/api/v1/health/live').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - remote_screen_net

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_SOCKET_URL: ${NEXT_PUBLIC_BACKEND_SOCKET_URL:-https://api.yourdomain.com}
        BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://backend:4100}
    container_name: remote_screen_prod_dashboard
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      - NODE_ENV=production
      - BACKEND_BASE_URL=${BACKEND_BASE_URL:-http://backend:4100}
      - BACKEND_PUBLIC_SOCKET_URL=${BACKEND_PUBLIC_SOCKET_URL:-https://api.yourdomain.com}
      - DASHBOARD_COOKIE_SECURE=${DASHBOARD_COOKIE_SECURE:-true}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r => process.exit(0)).catch(() => process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - remote_screen_net

  nginx:
    image: nginx:1.25-alpine
    container_name: remote_screen_prod_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - uploads_data:/usr/share/nginx/html/uploads:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
      - dashboard
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - remote_screen_net

  mongo:
    image: mongo:7.0
    container_name: remote_screen_prod_mongo
    restart: unless-stopped
    volumes:
      - mongo_prod_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=remote_screen_prod
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_ROOT_USER:-admin}", "-p", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - remote_screen_net

  redis:
    image: redis:7-alpine
    container_name: remote_screen_prod_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - remote_screen_net

volumes:
  mongo_prod_data:
  redis_prod_data:
  uploads_data:
  certbot_etc:
  certbot_www:

networks:
  remote_screen_net:
    driver: bridge
