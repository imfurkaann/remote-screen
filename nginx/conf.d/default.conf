# Upstream definitions
upstream backend_service {
    server backend:4100;
}

upstream dashboard_service {
    server dashboard:3000;
}

server {
    listen 80;
    server_name localhost _;

    # ACME-challenge for Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Screen previews may contain sensitive information. They are served only
    # through the authenticated dashboard API.
    location ^~ /uploads/screenshots/ {
        return 404;
    }

    # Static Media Uploads
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri @backend_uploads;
    }

    location @backend_uploads {
        proxy_pass http://backend_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO & WebSockets Proxy
    location /socket.io/ {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API Endpoints & Health Check
    # Dashboard owns /api/auth, /api/socket-ticket, /api/content, etc.
    # Only versioned backend APIs and backend health endpoints bypass Next.js.
    location ~ ^/(api/v1(?:/|$)|health(?:/|$)|metrics(?:/|$)) {
        proxy_pass http://backend_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js Dashboard Frontend
    location / {
        proxy_pass http://dashboard_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
